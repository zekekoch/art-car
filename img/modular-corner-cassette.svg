<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual identical drive-steer-suspension corner cassette</title>
  <desc id="desc">Side and front diagrams of a removable corner cassette with a square chassis flange, suspension links and coilover, electric steering axis, geared traction motor, friction brake and pneumatic tire.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F5D8A"/></marker>
    <style>
      .bg{fill:#ECEFF3}.panel{fill:#F7F8FA;stroke:#D5DCE4;stroke-width:2}.frame{fill:#1B2A41}.steel{fill:#DCE8F1;stroke:#2F5D8A;stroke-width:3}.moving{fill:#E6EDF3;stroke:#2F5D8A;stroke-width:3}.service{fill:none;stroke:#B8348A;stroke-width:3;stroke-dasharray:9 7}.motor{fill:#F3E4EF;stroke:#B8348A;stroke-width:3}.steer{fill:#E3F0EA;stroke:#2E7D5B;stroke-width:3}.brake{fill:#F5E8D8;stroke:#C18435;stroke-width:3}.wheel{fill:#303943;stroke:#1B2A41;stroke-width:4}.rim{fill:#D7DDE4;stroke:#5F6E80;stroke-width:3}.hub{fill:#9DB3C9;stroke:#2F5D8A;stroke-width:3}.link{fill:none;stroke:#2F5D8A;stroke-width:12;stroke-linecap:round}.pivot{fill:#F7F8FA;stroke:#1B2A41;stroke-width:3}.spring{fill:none;stroke:#C18435;stroke-width:6;stroke-linejoin:round}.axis{stroke:#2E7D5B;stroke-width:4;stroke-dasharray:8 6}.call{fill:none;stroke:#2F5D8A;stroke-width:2;marker-end:url(#arr)}.bolt{fill:#B8348A;stroke:#F7F8FA;stroke-width:1.5}.title{font:700 28px system-ui,sans-serif;fill:#1B2A41}.sub{font:16px system-ui,sans-serif;fill:#5F6E80}.head{font:700 20px system-ui,sans-serif;fill:#1B2A41}.label{font:600 16px system-ui,sans-serif;fill:#1B2A41}.small{font:14px system-ui,sans-serif;fill:#5F6E80}.tiny{font:12px system-ui,sans-serif;fill:#5F6E80}.pink{fill:#B8348A}.green{fill:#2E7D5B}.orange{fill:#9A641E}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="52" y="50">One complete corner cassette</text>
  <text class="sub" x="52" y="78">One possible package: suspension, steering, traction, brake, tire and local electronics stay together when the corner is swapped</text>

  <rect class="panel" x="42" y="112" width="720" height="582" rx="12"/>
  <rect class="panel" x="790" y="112" width="368" height="582" rx="12"/>
  <text class="head" x="70" y="150">Side elevation</text>
  <text class="head" x="818" y="150">Front section</text>

  <!-- side elevation, chassis -->
  <rect class="frame" x="92" y="205" width="92" height="292" rx="3"/>
  <text class="small" x="76" y="535">rigid chassis</text>
  <rect class="steel" x="169" y="226" width="48" height="244" rx="4"/>
  <circle class="bolt" cx="181" cy="246" r="5"/><circle class="bolt" cx="205" cy="246" r="5"/><circle class="bolt" cx="181" cy="348" r="5"/><circle class="bolt" cx="205" cy="348" r="5"/><circle class="bolt" cx="181" cy="450" r="5"/><circle class="bolt" cx="205" cy="450" r="5"/>
  <text class="small" x="116" y="190">square/indexable chassis flange</text>
  <path class="call" d="M198 190L195 225"/>

  <!-- service boundary -->
  <path class="service" d="M155 178H690Q718 178 718 206V623Q718 652 690 652H155Z"/>
  <text class="label pink" x="478" y="677">field-replaceable boundary</text>

  <!-- fixed cassette tower -->
  <path class="steel" d="M217 235H352V284H318V440H352V488H217Z"/>
  <circle class="pivot" cx="310" cy="278" r="13"/><circle class="pivot" cx="310" cy="446" r="13"/>

  <!-- moving upright and links -->
  <path class="link" d="M310 278L498 315"/>
  <path class="link" d="M310 446L498 409"/>
  <circle class="pivot" cx="498" cy="315" r="13"/><circle class="pivot" cx="498" cy="409" r="13"/>
  <rect class="moving" x="482" y="291" width="62" height="142" rx="9"/>

  <!-- coilover -->
  <line class="spring" x1="270" y1="240" x2="420" y2="392"/>
  <path class="spring" d="M302 272l21 1-2 22 22-2-2 22 22-2-2 22 22-2 4 22"/>
  <circle class="pivot" cx="270" cy="240" r="9"/><circle class="pivot" cx="420" cy="392" r="9"/>
  <text class="label orange" x="300" y="366">coilover</text>
  <text class="small" x="270" y="385">preload-adjustable; 3–4″ travel target</text>

  <!-- steering bearing and servo -->
  <rect class="steer" x="530" y="250" width="96" height="58" rx="10"/>
  <text class="small" x="578" y="275" text-anchor="middle">steering servo</text>
  <text class="tiny" x="578" y="294" text-anchor="middle">gear + absolute encoder</text>
  <ellipse class="steer" cx="578" cy="334" rx="62" ry="18"/>
  <line class="axis" x1="578" y1="308" x2="578" y2="520"/>
  <text class="label green" x="640" y="336">steer axis</text>

  <!-- traction drive -->
  <rect class="motor" x="487" y="454" width="132" height="76" rx="14"/>
  <text class="label" x="553" y="484" text-anchor="middle">2–3 kW traction</text>
  <text class="small" x="553" y="507" text-anchor="middle">motor + reduction</text>
  <path class="steel" d="M616 475H654V509H616Z"/>

  <!-- wheel side -->
  <circle class="wheel" cx="650" cy="482" r="116"/>
  <circle class="rim" cx="650" cy="482" r="65"/>
  <circle class="hub" cx="650" cy="482" r="25"/>
  <path class="brake" d="M609 431Q575 482 609 533L630 516Q611 482 630 448Z"/>
  <text class="small" x="614" y="561">hydraulic service brake</text>
  <text class="small" x="607" y="582">+ held parking brake</text>
  <text class="label" x="649" y="615" text-anchor="middle">23 × 10.50-12 pneumatic turf tire target</text>

  <!-- connectors -->
  <rect class="motor" x="239" y="518" width="78" height="44" rx="8"/>
  <rect class="steer" x="328" y="518" width="78" height="44" rx="8"/>
  <rect class="brake" x="417" y="518" width="78" height="44" rx="8"/>
  <text class="tiny" x="278" y="544" text-anchor="middle">48 V power</text>
  <text class="tiny" x="367" y="544" text-anchor="middle">CAN / LV</text>
  <text class="tiny" x="456" y="537" text-anchor="middle">brake</text><text class="tiny" x="456" y="552" text-anchor="middle">interface</text>

  <!-- front section -->
  <rect class="frame" x="835" y="198" width="278" height="56" rx="3"/>
  <text class="small" x="974" y="187" text-anchor="middle">chassis crossmember / cassette flange</text>
  <rect class="steel" x="887" y="246" width="174" height="52" rx="5"/>
  <circle class="bolt" cx="906" cy="264" r="5"/><circle class="bolt" cx="1042" cy="264" r="5"/><circle class="bolt" cx="906" cy="282" r="5"/><circle class="bolt" cx="1042" cy="282" r="5"/>
  <rect class="steer" x="915" y="304" width="118" height="52" rx="10"/>
  <text class="small" x="974" y="335" text-anchor="middle">steering gear + encoder</text>
  <ellipse class="steer" cx="974" cy="382" rx="82" ry="21"/>
  <line class="axis" x1="974" y1="356" x2="974" y2="570"/>
  <path class="spring" d="M881 286L856 323l18 14-18 14 18 14-18 14 18 14-18 14 18 14-18 14 18 14-18 14 25 37"/>
  <text class="small" x="824" y="424" transform="rotate(-90 824 424)" text-anchor="middle">coilover and locating links sit inside cassette</text>
  <rect class="wheel" x="902" y="405" width="144" height="198" rx="55"/>
  <rect class="rim" x="928" y="442" width="92" height="124" rx="40"/>
  <circle class="hub" cx="974" cy="504" r="27"/>
  <path class="brake" d="M927 463Q901 504 927 545L947 529Q932 504 947 479Z"/>
  <text class="small" x="974" y="630" text-anchor="middle">entire powered wheel end turns</text>
  <text class="small" x="974" y="650" text-anchor="middle">around the vertical steer axis</text>

  <rect x="814" y="672" width="320" height="1" fill="#D5DCE4"/>
  <text class="tiny" x="974" y="690" text-anchor="middle">The final link geometry, bearing stack, offsets and brake plumbing require vendor CAD and a loaded prototype.</text>
  <text class="tiny" x="1145" y="730" text-anchor="end">Concept only · not a cut list or approved wheel-end design</text>
</svg>
