<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Four possible steering modes for independent drive-steer corners</title>
  <desc id="desc">Top-view diagrams of normal four-wheel steering, crab movement, center spin and true lateral movement, with cautions about mode interlocks and packaging.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F5D8A"/></marker>
    <marker id="pinkArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B8348A"/></marker>
    <style>
      .bg{fill:#ECEFF3}.panel{fill:#F7F8FA;stroke:#D5DCE4;stroke-width:2}.car{fill:#E2E8EF;stroke:#1B2A41;stroke-width:4}.rail{stroke:#1B2A41;stroke-width:5}.wheel{fill:#303943;stroke:#1B2A41;stroke-width:2}.dot{fill:#F3E4EF;stroke:#B8348A;stroke-width:2}.move{fill:none;stroke:#2F5D8A;stroke-width:5;marker-end:url(#blueArrow)}.special{fill:none;stroke:#B8348A;stroke-width:5;marker-end:url(#pinkArrow)}.arc{fill:none;stroke:#2F5D8A;stroke-width:5;stroke-dasharray:8 6;marker-end:url(#blueArrow)}.title{font:700 28px system-ui,sans-serif;fill:#1B2A41}.sub{font:16px system-ui,sans-serif;fill:#5F6E80}.head{font:700 20px system-ui,sans-serif;fill:#1B2A41}.body{font:14px system-ui,sans-serif;fill:#5F6E80}.tag{font:700 12px system-ui,sans-serif;letter-spacing:.08em;fill:#B8348A}.deg{font:600 13px system-ui,sans-serif;fill:#2F5D8A}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="50" y="48">What four independent steer axes make possible</text>
  <text class="sub" x="50" y="76">Normal steering is the default. Crab, spin and lateral modes require deliberate enable, a stopped vehicle and walking-speed limits.</text>

  <!-- Panel 1 -->
  <g transform="translate(38 112)">
    <rect class="panel" width="270" height="480" rx="12"/>
    <text class="head" x="22" y="36">1 · Normal four-wheel steer</text>
    <text class="body" x="22" y="61">Front and rear steer oppositely.</text>
    <text class="body" x="22" y="82">Conventional driver feel; tighter circle.</text>
    <g transform="translate(60 118)">
      <rect class="car" x="38" y="20" width="90" height="235" rx="8"/><line class="rail" x1="83" y1="20" x2="83" y2="255"/>
      <rect class="wheel" x="9" y="30" width="26" height="70" rx="8" transform="rotate(-20 22 65)"/>
      <rect class="wheel" x="131" y="30" width="26" height="70" rx="8" transform="rotate(-20 144 65)"/>
      <rect class="wheel" x="9" y="176" width="26" height="70" rx="8" transform="rotate(14 22 211)"/>
      <rect class="wheel" x="131" y="176" width="26" height="70" rx="8" transform="rotate(14 144 211)"/>
      <circle class="dot" cx="83" cy="137" r="7"/>
      <path class="arc" d="M177 238C238 181 236 89 174 38"/>
    </g>
    <text class="deg" x="135" y="408" text-anchor="middle">rear countersteer reduces swept radius</text>
    <text class="tag" x="22" y="453">POWER-UP DEFAULT</text>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(323 112)">
    <rect class="panel" width="270" height="480" rx="12"/>
    <text class="head" x="22" y="36">2 · Crab</text>
    <text class="body" x="22" y="61">All wheels point in the same direction.</text>
    <text class="body" x="22" y="82">The chassis moves diagonally without yaw.</text>
    <g transform="translate(60 118)">
      <rect class="car" x="38" y="20" width="90" height="235" rx="8"/><line class="rail" x1="83" y1="20" x2="83" y2="255"/>
      <rect class="wheel" x="9" y="30" width="26" height="70" rx="8" transform="rotate(-28 22 65)"/>
      <rect class="wheel" x="131" y="30" width="26" height="70" rx="8" transform="rotate(-28 144 65)"/>
      <rect class="wheel" x="9" y="176" width="26" height="70" rx="8" transform="rotate(-28 22 211)"/>
      <rect class="wheel" x="131" y="176" width="26" height="70" rx="8" transform="rotate(-28 144 211)"/>
      <circle class="dot" cx="83" cy="137" r="7"/>
      <path class="special" d="M68 275L176 167"/>
    </g>
    <text class="deg" x="135" y="408" text-anchor="middle">useful for lining up with a ramp or camp lane</text>
    <text class="tag" x="22" y="453">STOP TO SELECT · LOW SPEED</text>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(608 112)">
    <rect class="panel" width="270" height="480" rx="12"/>
    <text class="head" x="22" y="36">3 · Spin about the centre</text>
    <text class="body" x="22" y="61">Each wheel is tangent to a circle around</text>
    <text class="body" x="22" y="82">the chassis centre; wheel speeds differ.</text>
    <g transform="translate(60 118)">
      <rect class="car" x="38" y="20" width="90" height="235" rx="8"/><line class="rail" x1="83" y1="20" x2="83" y2="255"/>
      <rect class="wheel" x="9" y="30" width="26" height="70" rx="8" transform="rotate(-57 22 65)"/>
      <rect class="wheel" x="131" y="30" width="26" height="70" rx="8" transform="rotate(57 144 65)"/>
      <rect class="wheel" x="9" y="176" width="26" height="70" rx="8" transform="rotate(57 22 211)"/>
      <rect class="wheel" x="131" y="176" width="26" height="70" rx="8" transform="rotate(-57 144 211)"/>
      <circle class="dot" cx="83" cy="137" r="7"/>
      <path class="arc" d="M83 1C171 1 216 74 205 143"/>
    </g>
    <text class="deg" x="135" y="408" text-anchor="middle">≈57° at the current 66 × 43″ wheel centres</text>
    <text class="tag" x="22" y="453">STOP TO SELECT · CLEAR PERIMETER</text>
  </g>

  <!-- Panel 4 -->
  <g transform="translate(893 112)">
    <rect class="panel" width="270" height="480" rx="12"/>
    <text class="head" x="22" y="36">4 · True lateral</text>
    <text class="body" x="22" y="61">All wheels turn 90° and the chassis</text>
    <text class="body" x="22" y="82">translates sideways.</text>
    <g transform="translate(60 118)">
      <rect class="car" x="38" y="20" width="90" height="235" rx="8"/><line class="rail" x1="83" y1="20" x2="83" y2="255"/>
      <rect class="wheel" x="-13" y="52" width="70" height="26" rx="8"/>
      <rect class="wheel" x="109" y="52" width="70" height="26" rx="8"/>
      <rect class="wheel" x="-13" y="198" width="70" height="26" rx="8"/>
      <rect class="wheel" x="109" y="198" width="70" height="26" rx="8"/>
      <circle class="dot" cx="83" cy="137" r="7"/>
      <path class="special" d="M-22 137L-92 137"/>
    </g>
    <text class="deg" x="135" y="408" text-anchor="middle">requires ±90° sweep and more wheel-well clearance</text>
    <text class="tag" x="22" y="453">OPTIONAL · PACKAGING NOT PROVEN</text>
  </g>
</svg>
